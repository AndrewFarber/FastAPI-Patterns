[project]
name = "fastapi-patterns-examples"
version = "0.1.0"
description = "Runnable, tested code shown in the FastAPI Patterns vault"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.35",
    "fastapi>=0.115",
    "psycopg[binary]>=3.2",
    "pydantic-settings[aws-secrets-manager,aws-systems-manager]>=2.16",
    "sqlalchemy>=2",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "moto[secretsmanager,ssm]>=5",
    "pytest>=8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 130
target-version = "py313"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app", "conftest"]
